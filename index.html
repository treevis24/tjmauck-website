<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TJ Mauck Films</title>
  <meta name="description" content="TJ Mauck is a director and cinematographer based in Los Angeles. Commercial, music video, documentary and narrative work.">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tjmauck.com/">
  <meta property="og:title" content="TJ Mauck Films">
  <meta property="og:description" content="Director &amp; cinematographer based in Los Angeles.">
  <meta property="og:image" content="https://tjmauck.com/assets/video/ben-harper-poster.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/carousel.css">
</head>
<body>

  <!-- Intro: cards fly up from below in 3D, stack, top card grows fullscreen.
       DOM order = stack order: bottom card first, first project last (on top). -->
  <div class="intro" aria-hidden="true">
    <div class="intro-stack">
      <div class="intro-card"><picture><source media="(max-width: 767px)" srcset="assets/video/sdf-loop-mobile-poster.jpg"><img src="assets/video/sdf-loop-poster.jpg" alt=""></picture></div>
      <div class="intro-card"><picture><source media="(max-width: 767px)" srcset="assets/video/whipsmart-mobile-poster.jpg"><img src="assets/video/whipsmart-poster.jpg" alt=""></picture></div>
      <div class="intro-card"><picture><source media="(max-width: 767px)" srcset="assets/video/hims-loop-mobile-poster.jpg"><img src="assets/video/hims-loop-poster.jpg" alt=""></picture></div>
      <div class="intro-card"><picture><source media="(max-width: 767px)" srcset="assets/video/only-in-dreams-loop-mobile-poster.jpg"><img src="assets/video/only-in-dreams-loop-poster.jpg" alt=""></picture></div>
      <div class="intro-card"><picture><source media="(max-width: 767px)" srcset="assets/video/aveeno-loop-mobile-poster.jpg"><img src="assets/video/aveeno-loop-poster.jpg" alt=""></picture></div>
      <div class="intro-card intro-card-top"><picture><source media="(max-width: 767px)" srcset="assets/video/ben-harper-mobile-poster.jpg"><img src="assets/video/ben-harper-poster.jpg" alt=""></picture></div>
    </div>
  </div>

  <!-- Transparent nav, animates in after the intro -->
  <header class="nav">
    <a class="nav-name" href="index.html">
      <span class="nav-title">TJ Mauck</span>
      <span class="nav-sub">Director | Cinematographer</span>
    </a>
    <nav class="nav-links">
      <a href="work.html" class="nav-work">Work</a>
      <a href="mailto:travis@tjmauck.com?subject=Hey%20TJ">Contact</a>
      <a href="#" class="nav-about">About</a>
    </nav>
  </header>

  <!-- Fullscreen video carousel: horizontal + wheel-driven on desktop, vertical snap on mobile -->
  <main class="carousel" data-active="0">
    <div class="track">

      <section class="slide" data-project="ben-harper"
               data-watch="https://player.vimeo.com/video/1070519366?h=5d125dd725&autoplay=1&title=0&byline=0&portrait=0"
               data-grabs="ben-harper"
               data-video="assets/video/ben-harper"
               data-video-mobile="assets/video/ben-harper-mobile">
        <figure class="media">
          <video muted loop playsinline preload="none" poster="assets/video/ben-harper-poster.jpg"></video>
        </figure>
        <div class="slide-title">
          <span class="st-client">Ben Harper</span>
          <span class="st-name">Before the Rain Dried</span>
        </div>
      </section>

      <section class="slide" data-project="aveeno"
               data-watch="https://player.vimeo.com/video/1215867282?h=42cb956fa2&autoplay=1&title=0&byline=0&portrait=0&badge=0"
               data-grabs="aveeno"
               data-video="assets/video/aveeno-loop"
               data-video-mobile="assets/video/aveeno-loop-mobile">
        <figure class="media">
          <video muted loop playsinline preload="none" poster="assets/video/aveeno-loop-poster.jpg"></video>
        </figure>
        <div class="slide-title">
          <span class="st-client">Aveeno</span>
          <span class="st-name">Healthy Is Our Nature</span>
        </div>
      </section>

      <section class="slide" data-project="only-in-dreams"
               data-watch="https://www.youtube.com/watch?v=EvfffIIJ0d0"
               data-external="true"
               data-grabs="only-in-dreams"
               data-video="assets/video/only-in-dreams-loop"
               data-video-mobile="assets/video/only-in-dreams-loop-mobile">
        <figure class="media">
          <video muted loop playsinline preload="none" poster="assets/video/only-in-dreams-loop-poster.jpg"></video>
        </figure>
        <div class="slide-title">
          <span class="st-client">Only in Dreams</span>
        </div>
      </section>

      <section class="slide" data-project="hims"
               data-watch="https://player.vimeo.com/video/563594183?autoplay=1&title=0&byline=0&portrait=0"
               data-grabs="hims"
               data-video="assets/video/hims-loop"
               data-video-mobile="assets/video/hims-loop-mobile">
        <figure class="media">
          <video muted loop playsinline preload="none" poster="assets/video/hims-loop-poster.jpg"></video>
        </figure>
        <div class="slide-title">
          <span class="st-client">Hims</span>
          <span class="st-name">Life Is Sexual</span>
        </div>
      </section>

      <section class="slide" data-project="whipsmart"
               data-watch="https://player.vimeo.com/video/1205864168?autoplay=1&title=0&byline=0&portrait=0&badge=0"
               data-grabs="whipsmart"
               data-video="assets/video/whipsmart"
               data-video-mobile="assets/video/whipsmart-mobile">
        <figure class="media">
          <video muted loop playsinline preload="none" poster="assets/video/whipsmart-poster.jpg"></video>
        </figure>
        <div class="slide-title">
          <span class="st-client">Whipsmart</span>
          <span class="st-name">Your Story Starts Here</span>
        </div>
      </section>

      <section class="slide" data-project="sdf"
               data-watch="https://player.vimeo.com/video/276766887?autoplay=1&title=0&byline=0&portrait=0"
               data-grabs="search-dog"
               data-video="assets/video/sdf-loop"
               data-video-mobile="assets/video/sdf-loop-mobile">
        <figure class="media">
          <video muted loop playsinline preload="none" poster="assets/video/sdf-loop-poster.jpg"></video>
        </figure>
        <div class="slide-title">
          <span class="st-client">SDF</span>
          <span class="st-name">From Rescued to Rescuer</span>
        </div>
      </section>

    </div>
  </main>

  <!-- Film overlay: full piece plays over a wall of stills, like the Work page -->
  <div class="film-view" hidden>
    <button class="fv-close" aria-label="Close">&times;</button>
    <div class="fv-collage"></div>
    <figure class="fv-stage">
      <div class="fv-media"></div>
      <figcaption class="fv-title"></figcaption>
    </figure>
  </div>

  <script src="js/carousel.js"></script>
</body>
</html>
