<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TJ Mauck Films</title>
  <meta name="description" content="TJ Mauck is a director and cinematographer based in Los Angeles. Commercial, music video, documentary and narrative work.">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tjmauck.com/">
  <meta property="og:title" content="TJ Mauck Films">
  <meta property="og:description" content="Director &amp; cinematographer based in Los Angeles.">
  <meta property="og:image" content="https://tjmauck.com/assets/video/whipsmart-poster.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/carousel.css">
</head>
<body>

  <!-- Intro: cards fly up from below in 3D, stack, top card grows fullscreen.
       DOM order = stack order: bottom card first, first project last (on top). -->
  <div class="intro" aria-hidden="true">
    <div class="intro-stack">
      <div class="intro-card"><img src="assets/video/ben-harper-poster.jpg" alt=""></div>
      <div class="intro-card intro-card-top"><img src="assets/video/whipsmart-poster.jpg" alt=""></div>
    </div>
  </div>

  <!-- Transparent nav, animates in after the intro -->
  <header class="nav">
    <a class="nav-name" href="/">
      <span class="nav-title">TJ Mauck</span>
      <span class="nav-sub">Director | Cinematographer</span>
    </a>
    <nav class="nav-links">
      <a href="mailto:travis@tjmauck.com?subject=Hey%20TJ">Contact</a>
    </nav>
  </header>

  <!-- Fullscreen video carousel: horizontal + wheel-driven on desktop, vertical snap on mobile -->
  <main class="carousel" data-active="0">
    <div class="track">

      <section class="slide" data-project="whipsmart"
               data-video="assets/video/whipsmart"
               data-video-mobile="assets/video/whipsmart-mobile">
        <figure class="media">
          <video muted loop playsinline preload="none" poster="assets/video/whipsmart-poster.jpg"></video>
        </figure>
        <div class="slide-title">
          <span class="st-client">Whipsmart</span>
          <span class="st-name">Your Story Starts Here</span>
        </div>
      </section>

      <section class="slide" data-project="ben-harper"
               data-video="assets/video/ben-harper"
               data-video-mobile="assets/video/ben-harper-mobile">
        <figure class="media">
          <video muted loop playsinline preload="none" poster="assets/video/ben-harper-poster.jpg"></video>
        </figure>
        <div class="slide-title">
          <span class="st-client">Ben Harper</span>
          <span class="st-name">Before the Rain Dried</span>
        </div>
      </section>

    </div>
  </main>

  <script src="js/carousel.js"></script>
</body>
</html>
